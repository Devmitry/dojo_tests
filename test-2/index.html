    <main class="page-shell">
      <section class="services" aria-labelledby="services-title">
        <h1 class="services__title" id="services-title">Услуги</h1>

        <div
          class="services__viewport"
          tabindex="0"
          role="region"
          aria-label="Список стоматологических услуг"
        >
          <div class="services__track" id="services-track"></div>
        </div>
      </section>

      <section
        class="consultation"
        aria-labelledby="consultation-title"
      >
        <svg
          class="consultation__background"
          viewBox="0 0 1199 323"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <defs>
            <radialGradient
              id="form-gradient"
              cx="0"
              cy="0"
              r="1"
              gradientTransform="matrix(-278.05 278.834 551.64 253.613 814.833 44.1661)"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#233A5A" />
              <stop offset="1" stop-color="#3C6AB9" />
            </radialGradient>
          </defs>
          <path
            id="consultation-background-path"
            class="consultation-background-shape"
            fill="url(#form-gradient)"
            d="M1145.3 14.6296L1184.34 53.6346C1193.73 63.0127 1199 75.7368 1199 89.005V293C1199 309.569 1185.57 323 1169 323H127.378C114.125 323 101.413 317.738 92.0378 308.37L52.9996 269.365C43.6136 259.987 38.34 247.263 38.34 233.995V182.378C38.34 169.117 33.0721 156.4 23.6953 147.023L14.6447 137.972C5.26782 128.595 0 115.878 0 102.617V30C0 13.4315 13.4315 0 30 0H1109.96C1123.22 0 1135.93 5.26202 1145.3 14.6296Z"
          />
        </svg>

        <svg
          class="consultation__art"
          viewBox="0 0 1199 354"
          preserveAspectRatio="none"
          role="img"
          aria-label="Специалист стоматологической клиники"
        >
          <defs>
            <clipPath id="consultation-art-clip" clipPathUnits="userSpaceOnUse">
              <path
                class="consultation-clip-shape"
                d="M1145.3 14.6296L1184.34 53.6346C1193.73 63.0127 1199 75.7368 1199 89.005V324C1199 340.569 1185.57 354 1169 354H127.378C114.125 354 101.413 348.738 92.0378 339.37L52.9996 300.365C43.6136 290.987 38.34 278.263 38.34 264.995V213.378C38.34 200.117 33.0721 187.4 23.6953 178.023L14.6447 168.972C5.26782 159.595 0 146.878 0 133.617V30C0 13.4315 13.4315 0 30 0H1109.96C1123.22 0 1135.93 5.26202 1145.3 14.6296Z"
              />
            </clipPath>
          </defs>
          <image
            class="consultation__specialist consultation__specialist--mobile"
            href=""
            x="32.5"
            y="1"
            width="357"
            height="353"
            preserveAspectRatio="none"
            clip-path="url(#consultation-art-clip)"
          />
        </svg>

        <div class="consultation__specialist-frame" aria-hidden="true">
          <img
            class="consultation__specialist-photo"
            src=""
            width="700"
            height="1050"
            alt=""
            decoding="async"
            fetchpriority="high"
          />
        </div>

        <div class="consultation__glow" aria-hidden="true"></div>

        <div class="consultation__content">
          <h2 class="consultation__title" id="consultation-title">
            <span class="consultation__title-desktop">
              Запишитесь на бесплатную<br />консультацию прямо сейчас!
            </span>
            <span class="consultation__title-mobile">
              Запишитесь<br />на бесплатную<br />консультацию прямо<br />сейчас!
            </span>
          </h2>

          <p class="consultation__description">
            Хотите узнать подробнее? Наши специалисты ответят на все ваши вопросы и
            помогут<br class="consultation__description-break" /> выбрать оптимальный путь к
            здоровой и красивой улыбке.
          </p>

          <form class="appointment-form" id="appointment-form" novalidate>
            <div class="appointment-form__row">
              <div class="field">
                <label class="field__label" for="full-name">Введите ФИО</label>
                <input
                  class="field__input"
                  id="full-name"
                  name="fullName"
                  type="text"
                  placeholder="ФИО"
                  autocomplete="name"
                  required
                />
              </div>

              <div class="field">
                <label class="field__label" for="phone">Введите номер телефона</label>
                <input
                  class="field__input"
                  id="phone"
                  name="phone"
                  type="tel"
                  inputmode="tel"
                  placeholder="+7..."
                  autocomplete="tel"
                  required
                />
              </div>

              <button class="appointment-form__submit" type="submit">
                Записаться на прием
              </button>
            </div>

            <label class="consent">
              <input class="consent__input" type="checkbox" name="consent" required checked />
              <span class="consent__box" aria-hidden="true">
                <svg viewBox="0 0 20 20" focusable="false">
                  <path
                    d="M5.25 10.514C6.191 11.198 8.074 13.081 8.845 14.365C9.786 12.311 12.182 7.689 14.75 5.635"
                  />
                </svg>
              </span>
              <span class="consent__text">
                я даю свое согласие на
                <a href="#personal-data">обработку персональных данных</a>
              </span>
            </label>

            <p class="appointment-form__status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

</html>
